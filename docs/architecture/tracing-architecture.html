<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agent Tracing 系统架构</title>
  <style>
    :root {
      --paper: #f4f7f5;
      --ink: #18293a;
      --muted: #526a77;
      --line: #b1c4c0;
      --accent: #087f70;
      --accent-paper: #e3f3ee;
      --sans: "Geist", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body { margin: 0; padding: clamp(20px, 4vw, 60px); color: var(--ink); background: var(--paper); font: 16px/1.55 var(--sans); }
    main { max-width: 1160px; margin: 0 auto; }
    h1 { margin: 0 0 8px; font: 500 clamp(28px, 4vw, 42px)/1.2 "Instrument Serif", "Songti SC", serif; }
    p { margin: 0 0 20px; color: var(--muted); }
    .diagram { width: 100%; overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfc; }
    .diagram:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    svg { display: block; width: 100%; min-width: 1120px; font-family: var(--sans); }
    .zone { fill: #f1f6f3; stroke: var(--line); stroke-dasharray: 5 4; }
    .node rect { fill: #fff; stroke: var(--line); }
    .node.focus rect { fill: var(--accent-paper); stroke: var(--accent); }
    .node text { fill: var(--ink); }
    .node .name { font-size: 17px; font-weight: 650; }
    .node .detail, .label, .zone-title, .legend { fill: var(--muted); font-size: 13px; }
    .zone-title { font-weight: 650; }
    .path { fill: none; stroke: #42605e; stroke-width: 1.4; }
    .async { stroke-dasharray: 5 4; }
    a { color: var(--accent); text-underline-offset: 4px; }
    footer { margin-top: 12px; font-size: 14px; }
    @media print {
      body { padding: 0; }
      .diagram { overflow: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Agent Tracing 系统架构</h1>
    <p>SDK 上报客户端工具 Span，网关独立记录审计。Tracing 核对 call_id 和追踪上下文，匹配后在调用树中展示同一个工具节点。</p>
    <div class="diagram" role="region" aria-label="可横向滚动的系统架构图" tabindex="0">
      <svg viewBox="0 0 1120 528" role="img" aria-labelledby="tracing-architecture-title tracing-architecture-desc" xmlns="http://www.w3.org/2000/svg">
        <title id="tracing-architecture-title">Agent Tracing 采集、审计与查询</title>
        <desc id="tracing-architecture-desc">SDK 通过 OTLP 上报工具 Span 的父节点、客户端耗时及响应状态，网关返回 call_id 并通过 Outbox 提供策略、确认和执行证据。Tracing 核对关联后展示同一个工具节点，只有 SDK 时展示客户端记录。</desc>
        <defs>
          <marker id="tracing-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M 0 0 L 10 5 L 0 10 z" fill="#42605e"/>
          </marker>
        </defs>

        <rect class="zone" x="24" y="28" width="224" height="444" rx="8"/>
        <text class="zone-title" x="44" y="58">平台客户端</text>
        <rect class="zone" x="288" y="152" width="272" height="236" rx="8"/>
        <text class="zone-title" x="308" y="176">Tooling Gateway 执行域</text>
        <rect class="zone" x="600" y="28" width="496" height="444" rx="8"/>
        <text class="zone-title" x="620" y="58">Tracing</text>

        <g marker-end="url(#tracing-architecture-arrow)">
          <path class="path" d="M 228 132 H 624"/>
          <path class="path" d="M 228 160 H 256 Q 264 160 264 168 V 224 Q 264 232 272 232 H 312" marker-start="url(#tracing-architecture-arrow)"/>
          <path class="path" d="M 420 276 V 300"/>
          <path class="path" d="M 824 132 H 876"/>
          <path class="path async" d="M 528 336 H 572 Q 580 336 580 328 V 304 Q 580 296 588 296 H 624"/>
          <path class="path" d="M 824 296 H 840 Q 848 296 848 288 V 168 Q 848 160 856 160 H 876"/>
          <path class="path" d="M 228 404 H 876"/>
          <path class="path" d="M 970 348 V 176"/>
        </g>
        <g class="label" text-anchor="middle">
          <text x="424" y="123">OTLP/HTTP Trace（含工具 Span）</text>
          <text x="270" y="257">工具请求</text>
          <text x="270" y="276">返回 call_id</text>
          <text x="467" y="293">同事务写入</text>
          <text x="850" y="123">直写</text>
          <text x="585" y="360">异步消费</text>
          <text x="892" y="246">幂等更新</text>
          <text x="426" y="395">列表、调用树、详情</text>
          <text x="1022" y="296">查询</text>
        </g>

        <g class="node">
          <rect x="44" y="88" width="184" height="108" rx="8"/>
          <text class="name" x="60" y="117">Agent 应用与 SDK</text>
          <text class="detail" x="60" y="143">Agent、LLM 和工具 Span</text>
          <text class="detail" x="60" y="162">父节点、耗时与响应状态</text>
          <text class="detail" x="60" y="181">记录网关返回的 call_id</text>
        </g>
        <g class="node focus">
          <rect x="624" y="88" width="200" height="88" rx="8"/>
          <text class="name" x="640" y="117">OTLP Trace 接入</text>
          <text class="detail" x="640" y="143">验证身份与 Trace 归属</text>
          <text class="detail" x="640" y="162">批量写入，事务提交后确认</text>
        </g>
        <g class="node">
          <rect x="312" y="188" width="216" height="88" rx="8"/>
          <text class="name" x="328" y="217">网关、执行器与确认</text>
          <text class="detail" x="328" y="243">策略决策、确认、执行回执</text>
          <text class="detail" x="328" y="262">生成并返回 call_id</text>
        </g>
        <g class="node">
          <rect x="312" y="300" width="216" height="72" rx="8"/>
          <text class="name" x="328" y="329">网关审计与 Outbox</text>
          <text class="detail" x="328" y="353">执行侧持久化，事件可重放</text>
        </g>
        <g class="node">
          <rect x="624" y="252" width="200" height="88" rx="8"/>
          <text class="name" x="640" y="281">审计事件消费者</text>
          <text class="detail" x="640" y="307">按 call_id 建立工具主节点</text>
          <text class="detail" x="640" y="326">归并决策、确认和执行状态</text>
        </g>
        <g class="node focus">
          <rect x="876" y="88" width="188" height="88" rx="8"/>
          <text class="name" x="892" y="117">Tracing MySQL</text>
          <text class="detail" x="892" y="143">Session / Trace / Span</text>
          <text class="detail" x="892" y="162">工具节点及审计索引</text>
        </g>
        <g class="node">
          <rect x="44" y="360" width="184" height="88" rx="8"/>
          <text class="name" x="60" y="389">Agent 观测控制台</text>
          <text class="detail" x="60" y="415">开发者与安全管理员</text>
          <text class="detail" x="60" y="434">Session、时间线、调用树</text>
        </g>
        <g class="node">
          <rect x="876" y="348" width="188" height="108" rx="8"/>
          <text class="name" x="892" y="377">授权查询</text>
          <text class="detail" x="892" y="403">租户、环境、项目、Agent</text>
          <text class="detail" x="892" y="422">匹配后显示同一工具节点</text>
          <text class="detail" x="892" y="441">仅有 SDK 时显示其记录</text>
        </g>
        <g class="legend">
          <path class="path" d="M 44 500 H 76"/>
          <text x="84" y="505">调用或数据库写入</text>
          <path class="path async" d="M 236 500 H 268"/>
          <text x="276" y="505">异步审计事件</text>
        </g>
      </svg>
    </div>
    <footer><a href="tracing-architecture.md">查看完整架构设计</a></footer>
  </main>
</body>
</html>
